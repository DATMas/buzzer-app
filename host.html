<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buzzer — Host</title>
    <!-- Load credentials first, before anything else runs -->
    <script src="./config.js"></script>
</head>
<body>
    <h1>Host Screen</h1>
    <p>Room code: <strong id="roomCode"></strong></p>
    <!-- This div is where QRCode.js will draw the QR image into -->
    <div id="qrcode"></div>

    <!-- Leaderboard — fills in as buzzes arrive -->
    <div id="leaderboard">Waiting for buzzes...</div>

    <!-- Reset button — clears all buzzes for a new round -->
    <button id="resetBtn">Re-vote</button>


    <!-- script must come AFTER the library above -->
    <!-- Load the QRCode.js library BEFORE the module script -->
    <!-- QRCode.js doesn't support modules so it stays as a separate regular script -->
    <script src="./qrcode.min.js"></script>

    <script type="module">

        // ── IMPORTS FIRST ────────────────────────────────────
        import { supabase } from "./supabase.js";


        // ── Room Code Generator ──────────────────────────────
        // Generates a random 6 character code each time host page loads
        // Characters chosen to avoid confusion e.g. O vs 0, I vs 1
        const CHARACTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        function generateRoomCode() {
            let code = "";
            for (let i = 0; i < 6; i++) {
                const randomIndex = Math.floor(Math.random() * CHARACTERS.length);
                code += CHARACTERS[randomIndex];
            }
            return code;
        }


        // Now we can safely call it
        const roomCode = generateRoomCode();
        document.getElementById("roomCode").innerText = roomCode;

        console.log("Room code generated:", roomCode);

        // ── QR Code Generator ────────────────────────────────
        // Builds the full URL players will land on when they scan
        // window.location.origin automatically uses the correct domain
        // whether on Live Server or GitHub Pages
        const joinUrl = `${window.location.origin}/join.html?room=${roomCode}`;

        new QRCode(document.getElementById("qrcode"), {
            text: joinUrl,
            width: 220,
            height: 220,
            colorDark: "#000000",
            colorLight: "#ffffff"
        });

        console.log("Join URL:", joinUrl);


        // ── Buzzes array ─────────────────────────────────────
        // Stores all buzzes locally in arrival order
        // Re-rendered every time a new buzz comes in
        let buzzes = [];


        // ── Render leaderboard ───────────────────────────────
        // Clears and redraws the leaderboard from the buzzes array
        function renderLeaderboard() {
            const board = document.getElementById("leaderboard");

            if (buzzes.length === 0) {
                board.innerText = "Waiting for buzzes...";
                return;
            }

            board.innerHTML = "";

            buzzes.forEach((buzz, index) => {
                const entry = document.createElement("div");
                const medals = ["🥇", "🥈", "🥉"];
                const medal = medals[index] || `${index + 1}.`;
                entry.innerText = `${medal} ${buzz.nickname}`;
                board.appendChild(entry);
            });
        }


        // ── Real-time listener ───────────────────────────────
        // Subscribes to new rows in the buzzes table for this room
        // Fires instantly when any player hits the buzz button
        function startListening() {
            supabase
                .channel("buzzes-channel")
                .on("postgres_changes", {
                    event: "INSERT",
                    schema: "public",
                    table: "buzzes",
                    filter: `room=eq.${roomCode}`
                }, (payload) => {
                    console.log("New buzz received:", payload.new);

                    buzzes.push(payload.new);

                    // Sort by buzzed_at to guarantee correct order
                    // even if two buzzes arrive at nearly the same time
                    buzzes.sort((a, b) =>
                        new Date(a.buzzed_at) - new Date(b.buzzed_at)
                    );

                    renderLeaderboard();
                })
                .subscribe();
        }


        // ── Reset buzzes ─────────────────────────────────────
        // Clears local array and deletes all buzzes for this room
        // from Supabase so a fresh round can begin
        async function resetBuzzes() {
            buzzes = [];
            renderLeaderboard();

            const { error } = await supabase
                .from("buzzes")
                .delete()
                .eq("room", roomCode);

            if (error) {
                console.error("Reset failed:", error.message);
            } else {
                console.log("Buzzes cleared for room", roomCode);
            }
        }


        // ── Initialise ───────────────────────────────────────
        startListening();
        console.log("Listening started for room:", roomCode);
        renderLeaderboard();


        // ── Event listeners ──────────────────────────────────
        document.getElementById("resetBtn").addEventListener("click", resetBuzzes);

    </script>
</body>
</html>
