<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buzzer — Host</title>
    <!-- Load credentials first, before anything else runs -->
    <script src="./config.js"></script>
</head>
<body>
    <h1>Host Screen</h1>

    <!-- Shows whether buzzer is currently open or closed -->
    <p id="buzzerStatus">Buzzer: Closed</p>

    <!-- Host controls -->
    <!-- Open Buzzer lets players buzz -->
    <!-- Next Responder moves down the leaderboard -->
    <!-- Re-vote clears all buzzes for a fresh round -->
    <div id="controls">
        <button id="openBtn">Open Buzzer</button>
        <button id="nextBtn">Next Responder</button>
        <button id="resetBtn">Re-vote</button>
    </div>

    <p>Room code: <strong id="roomCode"></strong></p>

    <!-- This div is where QRCode.js will draw the QR image into -->
    <div id="qrcode"></div>

    <!-- Leaderboard — fills in as buzzes arrive -->
    <div id="leaderboard">Waiting for buzzes...</div>

    <!-- script must come AFTER the library above -->
    <!-- Load the QRCode.js library BEFORE the module script -->
    <!-- QRCode.js doesn't support modules so it stays as a separate regular script -->
    <script src="./qrcode.min.js"></script>

    <script type="module">

        // ── IMPORTS FIRST ────────────────────────────────────
        import { supabase } from "./supabase.js";


        // ── Room Code Generator ──────────────────────────────
        // Generates a random 6 character code each time host page loads
        // Characters chosen to avoid confusion e.g. O vs 0, I vs 1
        const CHARACTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        function generateRoomCode() {
            let code = "";
            for (let i = 0; i < 6; i++) {
                const randomIndex = Math.floor(Math.random() * CHARACTERS.length);
                code += CHARACTERS[randomIndex];
            }
            return code;
        }


        // Now we can safely call it
        const roomCode = generateRoomCode();
        document.getElementById("roomCode").innerText = roomCode;
        console.log("Room code generated:", roomCode);

        // ── QR Code Generator ────────────────────────────────
        // Builds the full URL players will land on when they scan
        // window.location.origin automatically uses the correct domain
        // whether on Live Server or GitHub Pages
        const joinUrl = `${window.location.origin}/join.html?room=${roomCode}`;

        new QRCode(document.getElementById("qrcode"), {
            text: joinUrl,
            width: 220,
            height: 220,
            colorDark: "#000000",
            colorLight: "#ffffff"
        });

        console.log("Join URL:", joinUrl);

        // ── State variables ──────────────────────────────────
        // buzzes stores all buzz events for the current round
        // buzzerOpen tracks whether players can currently buzz
        // currentResponder tracks which position in the leaderboard is active
        let buzzes = [];
        let buzzerOpen = false;
        let currentResponder = 0;

        // ── Create room ──────────────────────────────────────
        // Inserts a row into the rooms table when host page loads
        // onConflict.ignore() means if the room already exists do nothing
        async function createRoom() {
            const { error } = await supabase
                .from("rooms")
                .upsert(
                    { code: roomCode, buzzer_open: false },
                    { onConflict: "code", ignoreDuplicates: true }
                );

            if (error) {
                console.error("Room creation failed:", error.message);
            } else {
                console.log("Room created:", roomCode);
            }
        }

        // ── Toggle buzzer ────────────────────────────────────
        // Flips buzzer_open in the rooms table
        // Players listen to this in real time and enable/disable
        // their buzz button accordingly
        async function toggleBuzzer() {
            buzzerOpen = !buzzerOpen;

            const { error } = await supabase
                .from("rooms")
                .update({ buzzer_open: buzzerOpen })
                .eq("code", roomCode);

            if (error) {
                console.error("Buzzer toggle failed:", error.message);
                // Revert local state if Supabase update failed
                buzzerOpen = !buzzerOpen;
                return;
            }

            document.getElementById("openBtn").innerText =
                buzzerOpen ? "Close Buzzer" : "Open Buzzer";
            document.getElementById("buzzerStatus").innerText =
                buzzerOpen ? "Buzzer: Open 🟢" : "Buzzer: Closed 🔴";

            console.log("Buzzer is now:", buzzerOpen ? "open" : "closed");
        }


        // ── Next responder ───────────────────────────────────
        // Called when host clicks Next Responder.
        // Moves the highlight down the leaderboard one position.
        // Useful when the first buzzer answered incorrectly
        // and the host wants to give the next person a chance.
        function nextResponder() {
            // Don't go past the end of the list
            if (currentResponder >= buzzes.length - 1) {
                console.log("No more responders");
                return;
            }

            currentResponder++;

            // Re-render with the new current position highlighted
            renderLeaderboard();
        }

        // ── Render leaderboard ───────────────────────────────
        // Clears and redraws the leaderboard from the buzzes array
        function renderLeaderboard() {
            const board = document.getElementById("leaderboard");

            if (buzzes.length === 0) {
                board.innerText = "Waiting for buzzes...";
                currentResponder = 0;
                return;
            }

            board.innerHTML = "";

            buzzes.forEach((buzz, index) => {
                const entry = document.createElement("div");
                const medals = ["🥇", "🥈", "🥉"];
                const medal = medals[index] || `${index + 1}.`;
                entry.innerText = `${medal} ${buzz.nickname}`;
                // Highlight the current responder in bold
                // so the host knows whose turn it is
                if (index === currentResponder) {
                    entry.style.fontWeight = "bold";
                    entry.style.fontSize = "1.3em";
                }
                board.appendChild(entry);
            });
        }


        // ── Real-time listener ───────────────────────────────
        // Subscribes to new rows in the buzzes table for this room
        // Fires instantly when any player hits the buzz button
        function startListening() {
            supabase
                .channel("buzzes-channel")
                .on("postgres_changes", {
                    event: "INSERT",
                    schema: "public",
                    table: "buzzes",
                    filter: `room=eq.${roomCode}`
                }, (payload) => {
                    console.log("New buzz received:", payload.new);

                    buzzes.push(payload.new);

                    // Sort by buzzed_at to guarantee correct order
                    // even if two buzzes arrive at nearly the same time
                    buzzes.sort((a, b) =>
                        new Date(a.buzzed_at) - new Date(b.buzzed_at)
                    );

                    renderLeaderboard();
                })
                .subscribe();
        }


        // ── Reset buzzes ─────────────────────────────────────
        // Clears local array and deletes all buzzes for this room
        // from Supabase so a fresh round can begin
        async function resetBuzzes() {
            buzzes = [];
            currentResponder = 0;
            renderLeaderboard();


            // Close the buzzer first so players can't buzz
            // while the round is resetting
            buzzerOpen = false;
            document.getElementById("openBtn").innerText = "Open Buzzer";
            document.getElementById("buzzerStatus").innerText = "Buzzer: Closed 🔴";

            // Update rooms table — this triggers listenToRoomState
            // on all player screens, which resets their buzz button
            const { error: roomError } = await supabase
                .from("rooms")
                .update({ buzzer_open: false })
                .eq("code", roomCode);

            if (roomError) {
                console.error("Room reset failed:", roomError.message);
            }

            // Now tell Supabase to delete the rows
            // .delete() removes rows
            // .eq("room", roomCode) means "only delete rows where room = our code"
            // without .eq() it would delete EVERY row in the table

            const { error: buzzError } = await supabase
                .from("buzzes")
                .delete()
                .eq("room", roomCode);

            if (buzzError) {
                // error.message is a human readable description
                // e.g. "permission denied" or "relation does not exist"
                console.error("Reset failed:", error.message);
            } else {
                console.log("Buzzes cleared for room", roomCode);
            }
        }


        // ── Initialise ───────────────────────────────────────
        await createRoom();
        startListening();
        renderLeaderboard();
        console.log("Listening started for room:", roomCode);


        // ── Event listeners ──────────────────────────────────
        document.getElementById("openBtn").addEventListener("click", toggleBuzzer);
        document.getElementById("nextBtn").addEventListener("click", nextResponder);
        document.getElementById("resetBtn").addEventListener("click", resetBuzzes);

    </script>
</body>
</html>
