<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#46178f">
    <title>Buzzer — Host</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- Load credentials first, before anything else runs -->
    <script src="./config.js"></script>
</head>
<body>
    <div id="endGameModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <h2 class="modal-title">End this game?</h2>
            <p class="modal-msg">All players will be redirected automatically...</p>
            <div class="modal-buttons">
                <button id="confirmEndBtn" class="modal-btn modal-btn-danger">Yes, End Game</button>
                <button id="cancelEndBtn" class="modal-btn modal-btn-cancel">Cancel</button>
            </div>
        </div>
    </div>
    <div class="app-container">
        <div class="app-header">
            <div class="app-logo">⚡ Buzzer</div>
            <p class="app-tagline">Who's first?</p>
        </div>
        <div class="card host-main-card">
            <button id="endGameBtn" class="btn-end-game">End Game</button>
            <!-- Room code badge -->
            <div class="room-badge">
                <span class="room-label">Room</span>
                <span class="room-code" id="roomCode"></span>
            </div>

            <!-- QR code -->
            <div class="qr-wrapper">
                <div id="qrcode"></div>
            </div>
            <p class="qr-hint">Scan to join on your phone</p>

            <!-- Shareable link -->
            <!-- Players who can't scan can use this URL instead -->
            <div class="share-row">
                <input type="text" id="shareLink" class="share-input" readonly>
                <button id="copyBtn" class="btn-copy">Copy</button>
            </div>

            <!-- Buzzer status. Shows whether buzzer is currently open or closed -->
            <div class="buzzer-status closed" id="buzzerStatus">
                🔴 Buzzer Closed
            </div>



            <!-- Host controls -->
            <!-- Open Buzzer lets players buzz -->
            <!-- Next Responder moves down the leaderboard -->
            <!-- Re-vote clears all buzzes for a fresh round -->
            <div class="controls">
                <button class="btn btn-open" id="openBtn">Open Buzzer</button>
                <!--<button class="btn btn-next" id="nextBtn">Next Responder</button>-->
                <button class="btn btn-reset" id="resetBtn">Next vote</button>
            </div>

        </div>

        <!-- Players card — shows who has joined -->
        <div class="card">
            <div class="card-header-row">
                <h2>Players</h2>
                <!-- Player count badge updates in real time -->
                <span class="player-count" id="playerCount">0</span>
            </div>
            <div class="player-list" id="playerList">
                <p class="leaderboard-placeholder">No players yet…</p>
            </div>
        </div>

        <!-- Responses / leaderboard card -->
        <div class="card">
            <h2>Responses</h2>
            <div class="leaderboard" id="leaderboard">
                <p class="leaderboard-placeholder">Waiting for buzzes...</p>
            </div>
        </div>

    </div>
            <!-- script must come AFTER the library above -->
            <!-- Load the QRCode.js library BEFORE the module script -->
            <!-- QRCode.js doesn't support modules so it stays as a separate regular script -->
            <script src="./qrcode.min.js"></script>

            <script type="module">


                // ── IMPORTS ──────────────────────────────────────────
                import { supabase } from "./supabase.js";


                // ── Room code generator ──────────────────────────────
                // Avoids characters that look similar: O/0, I/1
                const CHARACTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

                function generateRoomCode() {
                    let code = "";
                    for (let i = 0; i < 6; i++) {
                        const randomIndex = Math.floor(Math.random() * CHARACTERS.length);
                        code += CHARACTERS[randomIndex];
                    }
                    return code;
                }

                // Check sessionStorage first — if a room code was generated
                // earlier in this browser session, reuse it so a refresh
                // doesn't create a brand new room and lose all players.
                // Only generate a fresh code if there isn't one saved yet.
                const savedRoomCode = sessionStorage.getItem("hostRoomCode");
                const roomCode = savedRoomCode || generateRoomCode();

                // If we just generated a new code, save it for future refreshes
                if (!savedRoomCode) {
                    sessionStorage.setItem("hostRoomCode", roomCode);
                }

                document.getElementById("roomCode").innerText = roomCode;
                console.log("Room code generated:", roomCode);


                // ── Build join URL and show QR + share link ──────────
                // window.location.origin gives the correct base URL
                // whether on Live Server or GitHub Pages automatically
                const joinUrl = window.location.href.replace("host.html", "join.html") + `?room=${roomCode}`;

                new QRCode(document.getElementById("qrcode"), {
                    text: joinUrl,
                    width: 200,
                    height: 200,
                    colorDark: "#000000",
                    colorLight: "#ffffff"
                });

                // Fill the share link input so the host can copy it
                document.getElementById("shareLink").value = joinUrl;
                console.log("Join URL:", joinUrl);


                // ── Copy link button ─────────────────────────────────
                // Uses the Clipboard API to copy the join URL.
                // Changes button text briefly to confirm the copy.
                document.getElementById("copyBtn").addEventListener("click", async () => {
                    try {
                        await navigator.clipboard.writeText(joinUrl);
                        const btn = document.getElementById("copyBtn");
                        btn.innerText = "Copied!";
                        btn.classList.add("copied");
                        // Reset after 2 seconds
                        setTimeout(() => {
                            btn.innerText = "Copy";
                            btn.classList.remove("copied");
                        }, 2000);
                    } catch (err) {
                        console.error("Copy failed:", err);
                    }
                });


                // ── State variables ──────────────────────────────────
                let buzzes = [];
                let players = [];
                let buzzerOpen = false;
                let currentResponder = 0;


                // ── Create room ──────────────────────────────────────
                // Inserts a row into rooms table on page load.
                // upsert with ignoreDuplicates means it won't overwrite
                // if the host accidentally refreshes the page.
                async function createRoom() {
                    const { error } = await supabase
                        .from("rooms")
                        .upsert(
                            { code: roomCode, buzzer_open: false, ended: false },
                            { onConflict: "code", ignoreDuplicates: true }
                        );
                    if (error) console.error("Room creation failed:", error.message);
                    else console.log("Room created:", roomCode);
                }


                // ── Toggle buzzer ────────────────────────────────────
                // Flips buzzer_open in the rooms table.
                // All player screens are listening to this in real time
                // and will enable or disable their buzz button instantly.
                async function toggleBuzzer() {
                    buzzerOpen = !buzzerOpen;

                    const { error } = await supabase
                        .from("rooms")
                        .update({ buzzer_open: buzzerOpen })
                        .eq("code", roomCode);

                    if (error) {
                        console.error("Buzzer toggle failed:", error.message);
                        buzzerOpen = !buzzerOpen;
                        return;
                    }

                    // Assign btn and status BEFORE the if/else that uses them
                    const btn = document.getElementById("openBtn");
                    const status = document.getElementById("buzzerStatus");


                    if (buzzerOpen) {
                        btn.innerText = "Close Buzzer";
                        btn.classList.add("is-open");
                        status.innerText = "🟢 Buzzer Open";
                        status.className = "buzzer-status open";
                    } else {
                        btn.innerText = "Open Buzzer";
                        btn.classList.remove("is-open");
                        status.innerText = "🔴 Buzzer Closed";
                        status.className = "buzzer-status closed";
                    }

                    console.log("Buzzer is now:", buzzerOpen ? "open" : "closed");
                }


                // ── Next responder ───────────────────────────────────
                // Moves the gold highlight down the leaderboard by one.
                // Used when the current responder answers incorrectly.
                function nextResponder() {
                    if (currentResponder >= buzzes.length - 1) {
                        console.log("No more responders");
                        return;
                    }
                    currentResponder++;
                    renderLeaderboard();
                }


                // ── Render leaderboard ───────────────────────────────
                // Clears and redraws from the buzzes array each time.
                // The .current class highlights the active responder.
                function renderLeaderboard() {
                    const board = document.getElementById("leaderboard");

                    if (buzzes.length === 0) {
                        board.innerHTML = '<p class="leaderboard-placeholder">Waiting for buzzes…</p>';
                        currentResponder = 0;
                        return;
                    }

                    board.innerHTML = "";

                    buzzes.forEach((buzz, index) => {
                        const entry = document.createElement("div");
                        entry.className = "leaderboard-entry" + (index === currentResponder ? " current" : "");
                        const medals = ["🥇", "🥈", "🥉"];
                        const medal = medals[index] || `${index + 1}.`;
                        entry.innerHTML = `
                    <span class="leaderboard-medal">${medal}</span>
                    <span class="leaderboard-name">${buzz.nickname}</span>
                `;
                        board.appendChild(entry);
                    });
                }


                // ── Render player list ───────────────────────────────
                // Redraws the player list from the players array.
                // Called whenever a new player joins.
                function renderPlayerList() {
                    const list = document.getElementById("playerList");
                    const count = document.getElementById("playerCount");

                    // Update the count badge
                    count.innerText = players.length;

                    if (players.length === 0) {
                        list.innerHTML = '<p class="leaderboard-placeholder">No players yet…</p>';
                        return;
                    }

                    list.innerHTML = "";

                    players.forEach((player) => {
                        const entry = document.createElement("div");
                        entry.className = "player-entry";
                        // Show a person emoji and the nickname
                        entry.innerHTML = `
                    <span class="player-icon">👤</span>
                    <span class="player-name">${player.nickname}</span>
                `;
                        list.appendChild(entry);
                    });
                }


                // ── Reset buzzes ─────────────────────────────────────
                // Clears local state, resets UI, and deletes buzz rows
                // from Supabase. Also closes the buzzer so players
                // can't buzz during the reset.
                async function resetBuzzes() {
                    buzzes = [];
                    currentResponder = 0;
                    renderLeaderboard();

                    // Reset buzzer state visually
                    buzzerOpen = false;
                    const btn = document.getElementById("openBtn");
                    const status = document.getElementById("buzzerStatus");
                    btn.innerText = "Open Buzzer";
                    btn.classList.remove("is-open");
                    status.innerText = "🔴 Buzzer Closed";
                    status.className = "buzzer-status closed";

                    // Update rooms table to close the buzzer
                    // This triggers listenToRoomState on all player screens
                    const { error: roomError } = await supabase
                        .from("rooms")
                        .update({ buzzer_open: false })
                        .eq("code", roomCode);

                    if (roomError) console.error("Room reset failed:", roomError.message);

                    // Delete all buzz rows for this room
                    const { error: buzzError } = await supabase
                        .from("buzzes")
                        .delete()
                        .eq("room", roomCode);

                    // BUG FIX: was logging error.message (undefined) instead of buzzError.message
                    if (buzzError) console.error("Buzz reset failed:", buzzError.message);
                    else console.log("Round reset for room", roomCode);
                }

                async function endGame() {
                    const { error } = await supabase
                        .from("rooms")
                        .update({ ended: true })
                        .eq("code", roomCode);

                    if (error) {
                        console.error("End game failed:", error.message);
                        return;
                    }

                    // Clear saved room code so next visit creates a fresh room
                    sessionStorage.removeItem("hostRoomCode");

                    window.location.href = "index.html";
                }
                // ── Real-time listener: buzzes ───────────────────────
                // Subscribes to INSERT events on the buzzes table.
                // Fires instantly when any player presses BUZZ.
                function startListening() {
                    supabase
                        .channel("buzzes-channel")
                        .on("postgres_changes", {
                            event: "INSERT",
                            schema: "public",
                            table: "buzzes",
                            filter: `room=eq.${roomCode}`
                        }, (payload) => {
                            console.log("New buzz received:", payload.new);
                            buzzes.push(payload.new);
                            // Sort by timestamp to guarantee correct order
                            buzzes.sort((a, b) => new Date(a.buzzed_at) - new Date(b.buzzed_at));
                            renderLeaderboard();
                        })
                        .subscribe();
                }


                // ── Real-time listener: players ──────────────────────
                // Subscribes to INSERT events on the players table.
                // Fires when a new player joins the room.
                function listenToPlayers() {
                    supabase
                        .channel("players-channel")
                        .on("postgres_changes", {
                            event: "INSERT",
                            schema: "public",
                            table: "players",
                            filter: `room=eq.${roomCode}`
                        }, (payload) => {
                            console.log("New player joined:", payload.new);
                            players.push(payload.new);
                            renderPlayerList();
                        })
                        .subscribe();
                }


                // ── Load existing players ────────────────────────────
                // If the host refreshes the page, this fetches any players
                // who already joined so the list isn't lost on reload.
                async function loadExistingPlayers() {
                    const { data, error } = await supabase
                        .from("players")
                        .select("*")
                        .eq("room", roomCode)
                        .order("joined_at", { ascending: true });

                    if (error) {
                        console.error("Failed to load players:", error.message);
                        return;
                    }

                    players = data;
                    renderPlayerList();
                }


                // ── Initialise ───────────────────────────────────────
                // Order matters:
                // 1. Create the room first so it exists before players try to join
                // 2. Load any existing players (handles host page refresh)
                // 3. Start both real-time listeners
                // 4. Render initial empty states
                await createRoom();
                await loadExistingPlayers();
                startListening();
                listenToPlayers();
                renderLeaderboard();
                console.log("Listening started for room:", roomCode);


                // ── Event listeners ──────────────────────────────────
                document.getElementById("openBtn").addEventListener("click", toggleBuzzer);
                document.getElementById("nextBtn").addEventListener("click", nextResponder);
                document.getElementById("resetBtn").addEventListener("click", resetBuzzes);
                // Show modal when End Game clicked
                document.getElementById("endGameBtn").addEventListener("click", () => {
                    document.getElementById("endGameModal").style.display = "flex";
                });

                // Hide modal on Cancel
                document.getElementById("cancelEndBtn").addEventListener("click", () => {
                    document.getElementById("endGameModal").style.display = "none";
                });

                // Confirm end — disable button to prevent double-click
                document.getElementById("confirmEndBtn").addEventListener("click", async () => {
                    const confirmBtn = document.getElementById("confirmEndBtn");
                    confirmBtn.innerText = "Ending…";
                    confirmBtn.disabled = true;
                    await endGame();
                });

                // Close modal when clicking the dark overlay outside the box
                document.getElementById("endGameModal").addEventListener("click", (e) => {
                    if (e.target === document.getElementById("endGameModal")) {
                        document.getElementById("endGameModal").style.display = "none";
                    }
                });
            </script>
</body>
</html>
