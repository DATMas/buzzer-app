<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buzzer — Join</title>
    <!-- Load credentials first, before anything else runs -->
    <script src="./config.js"></script>
</head>
<body>
    <!-- SCREEN 1: Nickname entry -->
    <!-- This is visible by default when the page loads -->
    <div id="nicknameScreen">
        <h1>Join Game</h1>
        <!-- We display the room code so players can confirm -->
        <!-- they scanned the right QR code -->
        <p>Room: <strong id="roomCodeDisplay"></strong></p>

        <input type="text"
               id="nicknameInput"
               placeholder="Enter your nickname"
               maxlength="20">

        <button id="joinBtn">Join</button>

        <!-- Error message shown if they try to join with empty nickname -->
        <!-- Hidden by default, we reveal it in JS if needed -->
        <p id="errorMsg" style="display:none; color:red;">
            Please enter a nickname
        </p>
    </div>
    <!-- SCREEN 2: Waiting room -->
    <!-- Hidden by default, shown after player successfully joins -->
    <div id="waitingScreen" style="display:none;">
        <h1>You're in! 🎉</h1>

        <!-- We'll fill this in with their nickname via JS -->
        <p>Playing as: <strong id="playerNameDisplay"></strong></p>

        <p>Waiting for the host to open the buzzer...</p>
    </div>
    <!-- SCREEN 3: Buzzer -->
    <!-- Hidden by default, shown when host opens the buzzer -->
    <div id="buzzerScreen" style="display:none;">
        <h1>Ready!</h1>
        <p>Playing as: <strong id="buzzerNameDisplay"></strong></p>

        <!-- The big button players will smash -->
        <button id="buzzBtn">BUZZ!</button>

        <!-- Shown after they buzz, hidden by default -->
        <p id="buzzConfirmation" style="display:none;">
            ✅ Buzzed! Waiting for host...
        </p>
    </div>
    <script type="module">

        // ── IMPORTS ALWAYS FIRST ─────────────────────────────
        import { supabase } from "./supabase.js";


        // ── Read room code from URL ──────────────────────────
        const params = new URLSearchParams(window.location.search);
        const room = params.get("room");
        document.getElementById("roomCodeDisplay").innerText = room || "No room found";


        // ── Screen switching functions ───────────────────────
        function switchToWaiting(nickname) {
            document.getElementById("nicknameScreen").style.display = "none";
            document.getElementById("waitingScreen").style.display = "block";
            document.getElementById("playerNameDisplay").innerText = nickname;
            console.log(`Player "${nickname}" in room "${room}"`);
        }

        function switchToBuzzer() {
            document.getElementById("waitingScreen").style.display = "none";
            document.getElementById("buzzerScreen").style.display = "block";
            const nickname = sessionStorage.getItem("playerNickname");
            document.getElementById("buzzerNameDisplay").innerText = nickname;
        }


        // ── Join function ────────────────────────────────────
        function joinGame() {
            const nickname = document.getElementById("nicknameInput").value.trim();
            if (!nickname) {
                document.getElementById("errorMsg").style.display = "block";
                return;
            }
            document.getElementById("errorMsg").style.display = "none";
            sessionStorage.setItem("playerNickname", nickname);
            sessionStorage.setItem("playerRoom", room);
            switchToWaiting(nickname);
        }


        // ── Buzz function ────────────────────────────────────
        async function buzz() {
            const nickname = sessionStorage.getItem("playerNickname");
            const room = sessionStorage.getItem("playerRoom");

            document.getElementById("buzzBtn").disabled = true;

            const { error } = await supabase
                .from("buzzes")
                .insert({
                    room: room,
                    nickname: nickname
                });

            if (error) {
                console.error("Buzz failed:", error.message);
                document.getElementById("buzzBtn").disabled = false;
                return;
            }

            document.getElementById("buzzBtn").style.display = "none";
            document.getElementById("buzzConfirmation").style.display = "block";
            console.log(`${nickname} buzzed in room ${room}`);
        }


        // ── Reload check ─────────────────────────────────────
        // Runs immediately when page loads
        // If player already joined before a reload, skip nickname screen
        const savedNickname = sessionStorage.getItem("playerNickname");
        const savedRoom = sessionStorage.getItem("playerRoom");
        if (savedNickname && savedRoom === room) {
            switchToWaiting(savedNickname);
        }


        // ── Event listeners ──────────────────────────────────
        // All attached here rather than via onclick in HTML
        document.getElementById("joinBtn").addEventListener("click", joinGame);
        document.getElementById("buzzBtn").addEventListener("click", buzz);
        document.getElementById("nicknameInput").addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                joinGame();
            }
        });


        // ── Temporary console test ───────────────────────────
        // Type switchToBuzzer() in DevTools console to test the buzzer screen
        window.switchToBuzzer = switchToBuzzer;

    </script>
</body>
</html>
