<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buzzer — Join</title>
</head>
<body>
    <!-- SCREEN 1: Nickname entry -->
    <!-- This is visible by default when the page loads -->
    <div id="nicknameScreen">
        <h1>Join Game</h1>
        <!-- We display the room code so players can confirm -->
        <!-- they scanned the right QR code -->
        <p>Room: <strong id="roomCodeDisplay"></strong></p>

        <input type="text"
               id="nicknameInput"
               placeholder="Enter your nickname"
               maxlength="20">

        <button onclick="joinGame()">Join</button>

        <!-- Error message shown if they try to join with empty nickname -->
        <!-- Hidden by default, we reveal it in JS if needed -->
        <p id="errorMsg" style="display:none; color:red;">
            Please enter a nickname
        </p>
    </div>
    <!-- SCREEN 2: Waiting room -->
    <!-- Hidden by default, shown after player successfully joins -->
    <div id="waitingScreen" style="display:none;">
        <h1>You're in! 🎉</h1>

        <!-- We'll fill this in with their nickname via JS -->
        <p>Playing as: <strong id="playerNameDisplay"></strong></p>

        <p>Waiting for the host to open the buzzer...</p>
    </div>

    <script>
        // Read the room code from the URL
        // When a player scans the QR, the URL looks like:
        //   join.html?room=K7QMNA
        // URLSearchParams lets us read those ?key=value pairs
        // window.location.search is the "?room=K7QMNA" part of the URL
        const params = new URLSearchParams(window.location.search);

        // .get("room") extracts the value after "room="
        // If the URL had no room parameter this returns null
        const room = params.get("room");

        // Display the room code on screen so players can verify
        // they're joining the right game
        document.getElementById("roomCodeDisplay").innerText = room || "No room found";

        // ── Shared function to switch to the waiting screen ──
        // We extract this into its own function because now
        // two places need to do it: joinGame() and the reload check above
        function switchToWaiting(nickname) {
            document.getElementById("nicknameScreen").style.display = "none";
            document.getElementById("waitingScreen").style.display = "block";
            document.getElementById("playerNameDisplay").innerText = nickname;
            console.log(`Player "${nickname}" in room "${room}"`);
        }
        // ── Join button handler ──────────────────────────

        function joinGame() {
            const nickname = document.getElementById("nicknameInput").value.trim();
            if (!nickname) {
                // Show the error message that was hidden in the HTML
                document.getElementById("errorMsg").style.display = "block";

                // Stop the function here, don't proceed
                return;
            }
            // If we get here the nickname is valid.
            // Hide the error message in case it was showing from a previous attempt
            document.getElementById("errorMsg").style.display = "none";

            // Store in sessionStorage instead of window
            // sessionStorage.setItem takes a key and a value, both strings
            sessionStorage.setItem("playerNickname", nickname);
            sessionStorage.setItem("playerRoom", room);

            switchToWaiting(nickname);
        }
        // ── Check on page load if player already joined ──────
        // If sessionStorage already has a nickname (from before the reload)
        // we skip the nickname screen entirely and go straight to waiting
        const savedNickname = sessionStorage.getItem("playerNickname");
        const savedRoom = sessionStorage.getItem("playerRoom");

        if (savedNickname && savedRoom === room) {
            // savedRoom === room check is important —
            // it makes sure the saved session is for THIS game's room code
            // not a leftover from a different game earlier in the same browser session
            switchToWaiting(savedNickname);
        }





        // ── Allow pressing Enter to join ─────────────────

        // Instead of forcing players to tap the button,
        // we listen for the Enter key on the nickname input.
        // "keydown" fires every time any key is pressed.
        // We check if the pressed key was specifically Enter.
        document.getElementById("nicknameInput").addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                joinGame();
            }
        });
        
    </script>
</body>
</html>
