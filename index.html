<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#46178f">
    <title>Buzzer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">

        <div class="landing-hero">
            <div class="app-logo">⚡ Buzzer</div>
            <p class="landing-tagline">Real-time buzzer for quizzes,<br>classrooms and pub nights</p>
        </div>

        <div class="card landing-card">
            <div class="landing-buttons">

                <!-- Start Game — goes to host page -->
                <a href="host.html" class="landing-btn landing-btn-host">
                    <span class="landing-btn-icon">🎮</span>
                    <span class="landing-btn-text">
                        <strong>Start a Game</strong>
                        <small>Host a new session</small>
                    </span>
                </a>

                <!-- Join Game — goes to join page without a room code -->
                <!-- Player will enter the room code manually -->
                <a href="join.html" class="landing-btn landing-btn-join">
                    <span class="landing-btn-icon">🙋</span>
                    <span class="landing-btn-text">
                        <strong>Join a Game</strong>
                        <small>Enter a room code</small>
                    </span>
                </a>

            </div>
        </div>

        <p class="landing-footer">Scan the QR code or share the link to invite players</p>

    </div>
</body>
</html>
